name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run the gate
        env:
          # The default testhost handshake can stall on cold Windows agents.
          VSTEST_CONNECTION_TIMEOUT: '180'
        run: pwsh ./verify.ps1

  publish:
    name: Publish win-x64
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish the artifact
        run: pwsh ./publish.ps1

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: JiuMi-win-x64-${{ github.run_number }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

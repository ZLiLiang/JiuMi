name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run the gate
        env:
          # The default testhost handshake can stall on cold Windows agents.
          VSTEST_CONNECTION_TIMEOUT: '180'
        run: pwsh ./verify.ps1

  release:
    name: Publish release
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Package win-x64 ZIP
        run: pwsh ./publish.ps1

      - name: Publish to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pwsh ./tools/publish-release.ps1 -SkipVerify -SkipGitee -Tag "${{ github.ref_name }}"

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JiuMi · 主页卡片进入动效原型</title>
<style>
  :root{
    --font: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{display:flex;font-family:var(--font);background:#0c0e13;color:#d8dbe2;overflow:hidden;}

  /* ================= 原型控制面板 ================= */
  .panel{width:330px;flex:0 0 330px;padding:20px;overflow-y:auto;background:#12151b;border-right:1px solid #23272f;}
  .panel h1{font-size:14px;margin:0 0 6px;font-weight:600;}
  .panel .tiny{font-size:11.5px;line-height:1.6;color:#8b93a1;margin:0 0 16px;}
  .group-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:#6d7480;margin:18px 0 8px;}
  .group-title span{float:right;text-transform:none;letter-spacing:0;color:#aab3c1;font-variant-numeric:tabular-nums;}

  .vlist{display:flex;flex-direction:column;gap:6px;}
  .vlist label{display:block;position:relative;}
  .vlist input{position:absolute;opacity:0;pointer-events:none;}
  .vcard{display:block;padding:9px 10px;border-radius:8px;border:1px solid #2a2f3a;background:#171b22;cursor:pointer;}
  .vcard:hover{border-color:#3a4150;}
  .vname{display:block;font-size:12.5px;font-weight:600;color:#dfe4ec;}
  .vdesc{display:block;font-size:11px;color:#848c99;margin-top:3px;line-height:1.45;}
  .vlist input:checked + .vcard{border-color:#3a6ea8;background:#18222f;box-shadow:inset 0 0 0 1px #2b4c74;}
  .vlist input:checked + .vcard .vname{color:#a9cdf5;}

  .seg{display:flex;gap:6px;}
  .seg label{flex:1 1 0;position:relative;}
  .seg input{position:absolute;opacity:0;pointer-events:none;}
  .seg span{display:block;text-align:center;padding:7px 6px;border-radius:6px;background:#171b22;border:1px solid #2a2f3a;font-size:12px;color:#b3bac6;cursor:pointer;}
  .seg input:checked + span{background:#1c2838;border-color:#3a6ea8;color:#cfe3ff;}
  .pbtn{flex:1 1 0;height:30px;border-radius:6px;border:1px solid #2a2f3a;background:#171b22;color:#c7d0dd;font-size:12px;font-family:inherit;cursor:pointer;}
  .pbtn:hover{border-color:#3a4150;}

  input[type=range]{width:100%;margin:2px 0 0;accent-color:#4b8ed6;}
  input[type=range]:disabled{opacity:.35;}
  .check{display:flex;align-items:center;gap:8px;font-size:12px;color:#b3bac6;margin-top:10px;cursor:pointer;}
  .check input{accent-color:#4b8ed6;}

  .phases{margin-top:8px;font-size:11.5px;line-height:1.7;color:#8b93a1;font-variant-numeric:tabular-nums;}
  .phases b{color:#c7d0dd;font-weight:600;}

  .hint{margin-top:20px;padding:10px 11px;border-radius:8px;background:#161a21;border:1px solid #23272f;font-size:11.5px;line-height:1.6;color:#8b93a1;}
  .hint b{color:#b9c2cf;font-weight:600;}

  /* ================= 舞台 ================= */
  .stagewrap{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;}
  #stage{transform-origin:top left;}
  .caption{font-size:12px;color:#7b8390;max-width:1200px;text-align:center;line-height:1.5;}

  .win{
    position:relative;display:flex;flex-direction:column;overflow:hidden;border-radius:8px;
    box-shadow:0 0 0 1px rgba(255,255,255,.10), 0 22px 70px rgba(0,0,0,.55);
  }

  /* ---------- 主题变量（外壳取 ADR-0006 定稿的变体 B） ---------- */
  .win.light{
    --mica: radial-gradient(1500px 820px at 10% -12%, #f3f8ff 0%, rgba(243,248,255,0) 60%),
            linear-gradient(148deg,#e4ecf7 0%,#d8e2f0 38%,#e7e1f1 72%,#f2e9e3 100%);
    --text-primary:#1b1b1b;
    --text-secondary:#5c5c5c;
    --text-disabled:#a6a6a6;
    --island-bg:rgba(255,255,255,.62);
    --island-border:rgba(255,255,255,.70);
    --card-bg:rgba(255,255,255,.42);
    --card-border:rgba(0,0,0,.07);
    --fly-bg:#f9fafb;
    --subtle-fill:rgba(0,0,0,.045);
    --divider:rgba(0,0,0,.08);
    --accent:#0a6fc2;
    --accent-soft:rgba(10,111,194,.10);
    --accent-fg:#ffffff;
    --accent-l1:#5a9bf0;
    --accent-d1:#1b4fa8;
    --soft-shadow:0 6px 22px rgba(20,30,50,.14);
    --pill-bg:rgba(0,0,0,.045);
    --pill-border:rgba(0,0,0,.16);
    --pill-fg:#5c5c5c;
    --scroll-thumb:rgba(0,0,0,.24);
    --btn-bg:rgba(0,0,0,.05);
    --btn-border:rgba(0,0,0,.09);
  }
  .win.dark{
    --mica: radial-gradient(1500px 820px at 10% -12%, #223044 0%, rgba(34,48,68,0) 60%),
            linear-gradient(148deg,#141b25 0%,#0d131a 40%,#181420 74%,#1f1916 100%);
    --text-primary:#ffffff;
    --text-secondary:rgba(255,255,255,.62);
    --text-disabled:rgba(255,255,255,.36);
    --island-bg:rgba(46,48,56,.55);
    --island-border:rgba(255,255,255,.10);
    --card-bg:rgba(255,255,255,.055);
    --card-border:rgba(255,255,255,.07);
    --fly-bg:#2c2f36;
    --subtle-fill:rgba(255,255,255,.07);
    --divider:rgba(255,255,255,.09);
    --accent:#6cc4ff;
    --accent-soft:rgba(108,196,255,.13);
    --accent-fg:#0b1a26;
    --accent-l1:#8ed0ff;
    --accent-d1:#1f6fb2;
    --soft-shadow:0 8px 26px rgba(0,0,0,.45);
    --pill-bg:rgba(108,196,255,.13);
    --pill-border:rgba(108,196,255,.40);
    --pill-fg:#8ed0ff;
    --scroll-thumb:rgba(255,255,255,.24);
    --btn-bg:rgba(255,255,255,.06);
    --btn-border:rgba(255,255,255,.09);
  }
  .win{background:var(--mica);color:var(--text-primary);}

  /* ---------- 标题栏 ---------- */
  .titlebar{height:40px;flex:0 0 40px;display:flex;align-items:center;padding-left:16px;}
  .brandmark{width:18px;height:18px;border-radius:4px;background:linear-gradient(135deg,var(--accent-l1),var(--accent-d1));}
  .brandname{margin-left:8px;font-size:12px;color:var(--text-secondary);}
  .captions{margin-left:auto;display:flex;height:40px;}
  .captions span{width:46px;display:grid;place-items:center;font-size:10px;color:var(--text-secondary);}

  /* ---------- 通用图标 ---------- */
  svg.icon{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}

  /* ---------- 外壳 ---------- */
  .body{flex:1;min-height:0;display:flex;padding:14px;gap:14px;}
  .nav-island{width:280px;flex:0 0 280px;padding:8px 8px 12px;display:flex;flex-direction:column;
              background:var(--island-bg);border:1px solid var(--island-border);border-radius:12px;
              -webkit-backdrop-filter:blur(30px) saturate(150%);backdrop-filter:blur(30px) saturate(150%);
              box-shadow:var(--soft-shadow);}
  .win.collapsed .nav-island{width:56px;flex:0 0 56px;align-items:center;}
  .win.collapsed .navlabel,.win.collapsed .pill{display:none;}
  .win.collapsed .navitem{justify-content:center;padding:0;gap:0;}
  .win.collapsed .navtoggle{width:32px;}
  .navtoggle{width:36px;height:32px;margin:0 0 8px;border:0;border-radius:4px;background:transparent;color:var(--text-primary);
             display:grid;place-items:center;cursor:pointer;}
  .navtoggle:hover{background:var(--subtle-fill);}
  .navtoggle svg{width:16px;height:16px;}
  .navlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
  .navgrow{flex:1;}
  .navdivider{height:1px;margin:12px 6px;background:var(--divider);}
  .navitem{position:relative;display:flex;align-items:center;gap:14px;height:36px;padding:0 12px;border-radius:4px;
           font-size:14px;color:var(--text-primary);cursor:pointer;}
  .navitem:hover:not(.disabled){background:var(--subtle-fill);}
  .navitem svg{width:16px;height:16px;flex:0 0 16px;}
  .navitem.selected{background:var(--subtle-fill);}
  .navitem.selected::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
                            width:3px;height:16px;border-radius:2px;background:var(--accent);}
  .navitem.selected svg{color:var(--accent);}
  .navitem.disabled{color:var(--text-disabled);cursor:default;}
  .navitem.disabled svg{color:var(--text-disabled);}
  .navitem .pill{margin-left:auto;}

  /* ---------- 内容岛 ---------- */
  .content-island{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;container-type:inline-size;
                  background:var(--island-bg);border:1px solid var(--island-border);border-radius:12px;
                  -webkit-backdrop-filter:blur(30px) saturate(150%);backdrop-filter:blur(30px) saturate(150%);
                  box-shadow:var(--soft-shadow);}
  .scroller{flex:1;overflow-y:auto;overflow-x:hidden;}
  .scroller::-webkit-scrollbar{width:12px;}
  .scroller::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:6px;border:3px solid transparent;background-clip:content-box;}
  .page{padding:32px 44px 36px;}

  /* ---------- 页面骨架 ---------- */
  .page-title{margin:0;font-size:28px;font-weight:600;letter-spacing:.1px;}
  .page-sub{margin:6px 0 0;font-size:13px;color:var(--text-secondary);}
  .section-title{margin:26px 0 10px;font-size:14px;font-weight:600;}

  /* ---------- 主页 ---------- */
  .hero{display:flex;gap:26px;align-items:center;margin-top:22px;padding:20px 24px;border-radius:12px;
        background:var(--card-bg);border:1px solid var(--card-border);}
  .hero-media{width:340px;height:200px;flex:0 0 340px;border-radius:10px;display:grid;place-items:center;
              background:linear-gradient(135deg,#2E7D32,#1565C0 55%,#6A3EC8);color:rgba(255,255,255,.85);font-size:12px;}
  .hero-body h2{margin:0;font-size:24px;font-weight:600;}
  .hero-body p{margin:8px 0 0;font-size:13px;line-height:1.6;color:var(--text-secondary);max-width:430px;}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .tool{display:flex;gap:14px;align-items:flex-start;width:100%;margin:0;padding:18px;border-radius:8px;
        background:var(--card-bg);border:1px solid var(--card-border);font-family:inherit;font-size:13px;
        color:var(--text-primary);text-align:left;appearance:none;}
  button.tool{cursor:pointer;}
  button.tool:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .tool.disabled{color:var(--text-disabled);cursor:default;}
  .badge{width:40px;height:40px;flex:0 0 40px;border-radius:8px;display:grid;place-items:center;color:#fff;}
  .badge svg{width:20px;height:20px;stroke-width:1.7;}
  .tool-body{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0;}
  .tool-title-row{display:flex;align-items:center;gap:8px;}
  .tool-title{font-size:14px;font-weight:600;}
  .tool.disabled .tool-title,.tool.disabled .tool-desc{color:var(--text-disabled);}
  .tool-desc{font-size:12px;line-height:1.5;color:var(--text-secondary);}
  .pill{font-size:10px;line-height:1.2;border-radius:9px;padding:2px 6px;border:1px solid var(--pill-border);
        background:var(--pill-bg);color:var(--pill-fg);white-space:nowrap;}

  /* ---------- 工具页 ---------- */
  .card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;overflow:hidden;}
  .row{display:flex;align-items:center;gap:16px;padding:14px 18px;}
  .row + .row{border-top:1px solid var(--divider);}
  .row-text{flex:1;min-width:0;}
  .row-title{font-size:13px;font-weight:600;}
  .row-hint{margin-top:2px;font-size:11.5px;color:var(--text-secondary);}
  .empty-state{display:flex;align-items:center;gap:16px;padding:18px;}
  .dropzone{margin-top:16px;padding:28px;border:1px dashed var(--btn-border);border-radius:8px;
            color:var(--text-secondary);font-size:13px;display:flex;align-items:center;justify-content:center;gap:10px;}
  .text-input{display:inline-block;min-width:120px;height:28px;line-height:26px;padding:0 8px;border:1px solid var(--btn-border);
              border-radius:4px;background:var(--card-bg);color:var(--text-primary);font-size:12.5px;}
  .seg-control{display:inline-flex;border:1px solid var(--btn-border);border-radius:4px;overflow:hidden;}
  .seg-control span{padding:5px 10px;font-size:12.5px;color:var(--text-secondary);border-left:1px solid var(--btn-border);}
  .seg-control span:first-child{border-left:0;}
  .seg-control .on{background:var(--subtle-fill);color:var(--text-primary);}
  .btn{height:32px;padding:0 12px;border-radius:4px;font-size:13px;font-family:inherit;cursor:pointer;
       background:var(--btn-bg);color:var(--text-primary);border:1px solid var(--btn-border);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);}
  #page [data-focus]:focus{outline:2px solid var(--accent);outline-offset:2px;}
  .clock-row{display:flex;align-items:center;gap:12px;padding:12px 18px;}
  .clock-row + .clock-row{border-top:1px solid var(--divider);}
  .clock-place{flex:1;font-size:13px;font-weight:600;}
  .clock-zone{font-size:11.5px;color:var(--text-secondary);}
  .clock-time{font-size:15px;font-variant-numeric:tabular-nums;}
  .chip{font-size:11px;padding:2px 8px;border-radius:9px;border:1px solid var(--pill-border);background:var(--pill-bg);color:var(--pill-fg);}
  .chip.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}

  /* ---------- 动画覆盖层 ---------- */
  .nav-layer{position:absolute;inset:0;z-index:6;overflow:hidden;border-radius:11px;pointer-events:none;}
  .anim-layer{position:absolute;inset:0;z-index:7;overflow:hidden;border-radius:11px;pointer-events:none;}
  .proxy{position:absolute;box-sizing:border-box;border:1px solid var(--card-border);background:var(--fly-bg);
         border-radius:8px;overflow:hidden;}
  .fly-badge{position:absolute;left:18px;top:18px;}

  /* ---------- 窄内容自适应（对应规格：内容宽 < 760 时单列） ---------- */
  @container (max-width: 760px){
    .hero{flex-direction:column;align-items:flex-start;}
    .hero-media{width:100%;flex:0 0 auto;max-width:340px;align-self:center;}
    .tools{grid-template-columns:1fr;}
  }

  /* ---------- 截图模式：?capture=1 隐藏面板 ---------- */
  body.capture .panel{display:none;}
  body.capture .caption{display:none;}
  body.capture{background:#000;}
  body.capture .stagewrap{padding:0;gap:0;align-items:flex-start;justify-content:flex-start;}
  body.capture .win{box-shadow:none;border-radius:0;}
</style>
</head>
<body>
  <aside class="panel">
    <h1>JiuMi · 主页卡片进入动效原型</h1>
    <p class="tiny">#99 的分镜对比原型。保留在 <code>docs/prototypes/</code> 作为规格的复现依据，不参与构建。</p>

    <div class="group-title">分镜</div>
    <div class="vlist" id="variants">
      <label><input type="radio" name="variant" value="A">
        <span class="vcard"><span class="vname">A｜两拍</span>
        <span class="vdesc">卡片以原尺寸移到内容区中心 → 停一下 → 向四周铺开</span></span></label>
      <label><input type="radio" name="variant" value="B" checked>
        <span class="vcard"><span class="vname">B｜连续生长</span>
        <span class="vdesc">平移与放大同时发生，路径经过中心，中途不停</span></span></label>
    </div>

    <div class="group-title">总时长 <span id="durOut">550 ms</span></div>
    <input type="range" id="dur" min="300" max="600" step="10" value="550">
    <div class="phases" id="phases"></div>

    <div class="group-title">窗口</div>
    <div class="seg" id="sizes">
      <label><input type="radio" name="size" value="1200" checked><span>1200 × 760</span></label>
      <label><input type="radio" name="size" value="900"><span>900 × 600（最小）</span></label>
    </div>

    <div class="group-title">主题</div>
    <div class="seg" id="themes">
      <label><input type="radio" name="theme" value="light" checked><span>浅色</span></label>
      <label><input type="radio" name="theme" value="dark"><span>深色</span></label>
    </div>

    <label class="check"><input type="checkbox" id="reduced"> 模拟「关闭 Windows 动画」</label>
    <label class="check"><input type="checkbox" id="freeze"> 冻结在中间帧</label>
    <input type="range" id="freezePos" min="10" max="90" step="10" value="50" disabled>

    <div class="group-title">操作</div>
    <div class="seg">
      <button class="pbtn" id="replay" type="button">重播上一段</button>
      <button class="pbtn" id="home" type="button">回到主页</button>
    </div>

    <div class="hint">
      <b>怎么试</b><br>
      · 点下方三张已启用卡：播放当前分镜（550ms）<br>
      · 点导航岛：200ms 顺序淡变 + 8px 上移<br>
      · 动画中再点导航：立刻打断并落页<br>
      · 切 A / B 看「停顿」与「文字先溶解」的差别<br>
      · 勾「冻结在中间帧」可逐点检查两种动效
    </div>
  </aside>

  <main class="stagewrap">
    <div id="stage"><div class="win" id="win"></div></div>
    <div class="caption" id="caption"></div>
  </main>

<script>
  const ICONS = {
    home:'<path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M9.5 20v-5.5h5V20"/>',
    video:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M10.2 9.6 15 12l-4.8 2.4z"/>',
    rename:'<path d="M4.5 19.5h4L19 9l-4-4L4.5 15.5z"/><path d="M14 5l4 4"/>',
    image:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.6" cy="10.2" r="1.5"/><path d="M4.4 17.4 9 12.8l3.4 3.4 2.6-2.4 4.4 4"/>',
    clock:'<circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 1.8"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="M12 3.4v2.3M12 18.3v2.3M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M3.4 12h2.3M18.3 12h2.3M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/>',
    menu:'<path d="M4 7h16M4 12h16M4 17h16"/>'
  };
  const icon = (n, cls) => '<svg class="' + (cls || 'icon') + '" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[n] + '</svg>';

  const TOOLS = [
    { key:'wechat',        name:'微信视频下载', color:'#2E7D32', icon:'video',  desc:'把视频号里的视频存到本地，省掉录屏这一步。', disabled:true },
    { key:'file-rename',   name:'批量重命名',   color:'#1565C0', icon:'rename', desc:'按规则成批改名，支持序号、日期与原文件名替换。' },
    { key:'image-convert', name:'图片格式转换', color:'#6A3EC8', icon:'image',  desc:'PNG、JPG、WebP 互相转换，可限制最大边与质量。' },
    { key:'world-clock',   name:'世界工作时间', color:'#C26A00', icon:'clock',  desc:'对照不同时区的工作时段，挑都在线的时间。' }
  ];

  const DEFAULTS = { A:450, B:550 };

  const state = {
    variant:'B', theme:'light', duration:550, size:1200, navCollapsed:false,
    page:'home', reduced:false, freeze:false, freezePos:50, lastTool:null
  };

  const QS = new URLSearchParams(location.search);
  const isCapture = QS.get('capture') === '1';
  if (isCapture) document.body.classList.add('capture');

  let active = null;
  let navActive = null;

  /* ================= 页面内容 ================= */

  function navMarkup() {
    const items = [
      { key:'home', icon:'home', label:'主页' },
      { key:null, icon:'video', label:'微信视频下载', disabled:true },
      { key:'file-rename', icon:'rename', label:'批量重命名' },
      { key:'image-convert', icon:'image', label:'图片格式转换' },
      { key:'world-clock', icon:'clock', label:'世界工作时间' }
    ];
    const item = it => '<li class="navitem' + (it.disabled ? ' disabled' : '')
      + (it.key === state.page ? ' selected' : '') + '"'
      + (it.disabled ? '' : ' data-nav="' + it.key + '"')
      + (state.navCollapsed ? ' title="' + it.label + '"' : '') + '>'
      + icon(it.icon) + '<span class="navlabel">' + it.label + '</span>'
      + (it.disabled ? '<span class="pill">即将推出</span>' : '') + '</li>';
    return '<nav class="nav-island">'
      + '<button class="navtoggle" data-action="toggle-nav" title="'
      + (state.navCollapsed ? '展开导航' : '收起导航') + '">' + icon('menu') + '</button>'
      + '<ul class="navlist">' + items.map(item).join('') + '</ul>'
      + '<div class="navgrow"></div><div class="navdivider"></div>'
      + '<ul class="navlist"><li class="navitem' + (state.page === 'settings' ? ' selected' : '')
      + '" data-nav="settings"' + (state.navCollapsed ? ' title="设置"' : '') + '>'
      + icon('settings') + '<span class="navlabel">设置</span></li></ul>'
      + '</nav>';
  }

  const cardMarkup = t => {
    const body = '<span class="badge" style="background:' + t.color + '">' + icon(t.icon) + '</span>'
      + '<span class="tool-body"><span class="tool-title-row"><span class="tool-title">' + t.name + '</span>'
      + (t.disabled ? '<span class="pill">即将推出</span>' : '') + '</span>'
      + '<span class="tool-desc">' + t.desc + '</span></span>';
    return t.disabled
      ? '<div class="tool disabled">' + body + '</div>'
      : '<button type="button" class="tool" data-tool="' + t.key + '">' + body + '</button>';
  };

  const homeMarkup = () =>
      '<h1 class="page-title">JiuMi</h1>'
    + '<p class="page-sub">常用的小工具，集中在一个干净的壳里。</p>'
    + '<div class="hero">'
    +   '<div class="hero-media">splash.gif</div>'
    +   '<div class="hero-body"><h2>零碎的小需求，收进一个壳里</h2>'
    +   '<p>JiuMi 把日常用得上的小工具收在同一个小窗口里：不用开浏览器，也不用装一堆扩展。</p></div>'
    + '</div>'
    + '<div class="section-title">工具</div>'
    + '<div class="tools">' + TOOLS.map(cardMarkup).join('') + '</div>';

  const pageMarkup = key => {
    if (key === 'file-rename') {
      return '<h1 class="page-title">批量重命名</h1>'
        + '<p class="page-sub">按规则成批改名，先预览再执行。</p>'
        + '<div class="section-title">来源</div>'
        + '<div class="card empty-state"><div class="row-text">'
        +   '<div class="row-title">还没有添加来源</div>'
        +   '<div class="row-hint">支持文件夹与文件，可跨目录、跨盘添加。</div>'
        + '</div><button class="btn primary" data-focus type="button">添加文件…</button></div>'
        + '<div class="section-title">规则</div>'
        + '<div class="card">'
        +   '<div class="row"><div class="row-text"><div class="row-title">查找替换</div>'
        +     '<div class="row-hint">把文件名里的空格换成下划线。</div></div>'
        +     '<span class="text-input">空格</span><span class="text-input">_</span></div>'
        +   '<div class="row"><div class="row-text"><div class="row-title">预览</div>'
        +     '<div class="row-hint">先看结果，再执行；可撤销。</div></div>'
        +     '<button class="btn" type="button">预览</button></div>'
        + '</div>';
    }
    if (key === 'image-convert') {
      return '<h1 class="page-title">图片格式转换</h1>'
        + '<p class="page-sub">批量转格式，可限制最大边与质量。</p>'
        + '<div class="section-title">基础</div>'
        + '<div class="card">'
        +   '<div class="row"><div class="row-text"><div class="row-title">输出格式</div>'
        +     '<div class="row-hint">JPG 与 WebP 可调质量。</div></div>'
        +     '<span class="seg-control"><span class="on">PNG</span><span>JPG</span><span>WebP</span></span></div>'
        +   '<div class="row"><div class="row-text"><div class="row-title">最大边</div>'
        +     '<div class="row-hint">只缩小，不放大。</div></div><span class="text-input">原尺寸</span></div>'
        +   '<div class="row"><div class="row-text"><div class="row-title">输出目录</div>'
        +     '<div class="row-hint">默认输出到源文件同目录。</div></div>'
        +     '<button class="btn" data-focus type="button">选择目录…</button></div>'
        + '</div>'
        + '<div class="dropzone">拖入图片，或 <button class="btn primary" type="button">选择图片…</button></div>';
    }
    if (key === 'world-clock') {
      return '<h1 class="page-title">世界工作时间</h1>'
        + '<p class="page-sub">对照不同时区的工作时段，挑都在线的时间。</p>'
        + '<div class="section-title">地点</div>'
        + '<div class="card">'
        +   '<div class="clock-row"><span class="clock-place">北京 · 中国</span><span class="clock-zone">UTC+8</span>'
        +     '<span class="clock-time">14:20</span><span class="chip on">工作中</span></div>'
        +   '<div class="clock-row"><span class="clock-place">伦敦 · 英国</span><span class="clock-zone">UTC+0</span>'
        +     '<span class="clock-time">06:20</span><span class="chip">未开始</span></div>'
        +   '<div class="clock-row"><span class="clock-place">旧金山 · 美国</span><span class="clock-zone">UTC-8</span>'
        +     '<span class="clock-time">22:20</span><span class="chip">已结束</span></div>'
        + '</div>'
        + '<div class="section-title"></div>'
        + '<button class="btn primary" data-focus type="button">添加地点</button>';
    }
    if (key === 'settings') {
      return '<h1 class="page-title">设置</h1>'
        + '<p class="page-sub">改动即时生效并自动保存。</p>'
        + '<div class="section-title">外观</div>'
        + '<div class="card"><div class="row"><div class="row-text"><div class="row-title">主题</div>'
        +   '<div class="row-hint">跟随系统时，切换系统主题立即生效。</div></div>'
        +   '<span class="seg-control"><span class="on">跟随系统</span><span>浅色</span><span>深色</span></span>'
        + '</div></div>'
        + '<div class="section-title">窗口</div>'
        + '<div class="card"><div class="row"><div class="row-text"><div class="row-title">关闭窗口时</div>'
        +   '<div class="row-hint">每次询问 / 隐藏到托盘 / 退出应用</div></div>'
        +   '<span class="seg-control"><span class="on">每次询问</span><span>隐藏到托盘</span><span>退出</span></span>'
        + '</div></div>';
    }
    return homeMarkup();
  };

  /* ================= 外壳渲染 ================= */

  function titlebarMarkup() {
    return '<div class="titlebar"><div class="brandmark"></div><span class="brandname">JiuMi</span>'
      + '<div class="captions"><span>&#8212;</span><span>&#9633;</span><span>&#10005;</span></div></div>';
  }

  function renderShell() {
    abortAnimation();
    abortNavTransition();
    const win = document.getElementById('win');
    win.className = 'win ' + state.theme + (state.navCollapsed ? ' collapsed' : '');
    win.style.width = state.size + 'px';
    win.style.height = (state.size === 900 ? 600 : 760) + 'px';
    win.innerHTML = titlebarMarkup()
      + '<div class="body">' + navMarkup()
      + '<section class="content-island" id="island">'
      +   '<div class="scroller" id="scroller"><div class="page" id="page">' + pageMarkup(state.page) + '</div></div>'
      +   '<div class="nav-layer" id="navLayer"></div>'
      +   '<div class="anim-layer" id="animLayer"></div>'
      + '</section></div>';
    fit();
  }

  function navigate(key, opts) {
    abortNavTransition();
    abortAnimation();
    if (state.page === key) { focusPage(); return; }
    if (opts && opts.animateNav && !state.reduced) { playNavTransition(key); return; }
    state.page = key;
    if (TOOLS.some(t => t.key === key && !t.disabled)) state.lastTool = key;
    document.getElementById('page').innerHTML = pageMarkup(key);
    document.getElementById('scroller').scrollTop = 0;
    updateNav();
    focusPage();
  }

  function abortNavTransition() {
    if (!navActive) return;
    const n = navActive;
    navActive = null;
    n.abort();
  }

  function playNavTransition(key) {
    const layer = document.getElementById('navLayer');
    const scroller = document.getElementById('scroller');
    const page = document.getElementById('page');
    if (!layer || !scroller || !page) { return; }

    const total = 200;
    const oldFade = 100;
    const pageFade = total - oldFade;
    const oldScroll = scroller.scrollTop;

    const clone = page.cloneNode(true);
    clone.removeAttribute('id');
    clone.inert = true;
    clone.setAttribute('aria-hidden', 'true');
    clone.style.position = 'absolute';
    clone.style.left = '0';
    clone.style.top = (-oldScroll) + 'px';
    clone.style.width = page.offsetWidth + 'px';
    layer.appendChild(clone);

    state.page = key;
    if (TOOLS.some(t => t.key === key && !t.disabled)) state.lastTool = key;
    page.innerHTML = pageMarkup(key);
    scroller.scrollTop = 0;
    updateNav();
    page.style.opacity = '0';
    page.style.transform = 'translateY(8px)';

    let stopped = false;
    const cleanup = () => {
      clone.remove();
      page.style.opacity = '';
      page.style.transform = '';
      navActive = null;
    };
    navActive = { abort: () => { stopped = true; cleanup(); } };

    const cap = state.freeze ? Math.min(total * state.freezePos / 100, total) : total;
    const t0 = performance.now();

    function tick(now) {
      if (stopped) return;
      const t = Math.min(now - t0, cap);
      const k = easeOut(clamp01((t - oldFade) / pageFade));
      page.style.opacity = String(k);
      page.style.transform = 'translateY(' + (8 * (1 - k)) + 'px)';
      clone.style.opacity = String(1 - clamp01(t / oldFade));
      if (t >= cap) {
        if (state.freeze) return;
        cleanup();
        focusPage();
        return;
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function swapPage(key) {
    state.page = key;
    document.getElementById('page').innerHTML = pageMarkup(key);
    document.getElementById('scroller').scrollTop = 0;
    updateNav();
  }

  function updateNav() {
    document.querySelectorAll('.navitem[data-nav]').forEach(el => {
      el.classList.toggle('selected', el.dataset.nav === state.page);
    });
  }

  function focusPage() {
    const el = document.querySelector('#page [data-focus]');
    if (el) el.focus({ preventScroll: true });
  }

  /* ================= 时间线与动画 ================= */

  function phases() {
    const t = state.duration;
    if (state.variant === 'A') {
      const move = Math.round(t * 0.31);
      const hold = Math.round(t * 0.11);
      const grow = Math.round(t * 0.36);
      const fade = Math.max(1, t - move - hold - grow);
      return { move, hold, grow, fade, total:t };
    }
    const grow = Math.round(t * 0.75);
    const fade = Math.max(1, t - grow);
    return { move:0, hold:0, grow, fade, total:t };
  }

  const lerp = (a, b, k) => a + (b - a) * k;
  const lerpRect = (a, b, k) => ({
    left:lerp(a.left, b.left, k), top:lerp(a.top, b.top, k),
    w:lerp(a.w, b.w, k), h:lerp(a.h, b.h, k)
  });
  const easeOut = k => 1 - Math.pow(1 - k, 3);
  const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const clamp01 = k => Math.max(0, Math.min(1, k));

  function abortAnimation() {
    if (!active) return;
    const a = active;
    active = null;
    a.abort();
  }

  function beginOverlay(tool) {
    const card = document.querySelector('#page [data-tool="' + tool + '"]');
    const layer = document.getElementById('animLayer');
    const scroller = document.getElementById('scroller');
    if (!card || !layer || !scroller) return null;

    const lr = layer.getBoundingClientRect();
    const cr = card.getBoundingClientRect();
    const zoom = lr.width / layer.clientWidth;
    const start = {
      left:(cr.left - lr.left) / zoom, top:(cr.top - lr.top) / zoom,
      w:cr.width / zoom, h:cr.height / zoom
    };
    const end = { left:0, top:0, w:layer.clientWidth, h:layer.clientHeight };
    const center = { left:(end.w - start.w) / 2, top:(end.h - start.h) / 2, w:start.w, h:start.h };

    const badge = card.querySelector('.badge');
    if (!badge) return null;

    card.style.opacity = '0';
    card.style.pointerEvents = 'none';

    const proxy = document.createElement('div');
    proxy.className = 'proxy';
    const flyBadge = badge.cloneNode(true);
    flyBadge.classList.add('fly-badge');
    flyBadge.setAttribute('aria-hidden', 'true');
    proxy.appendChild(flyBadge);
    layer.appendChild(proxy);

    const p = phases();
    const crossStart = p.total - p.fade;

    const setRect = (r, radius) => {
      proxy.style.left = r.left + 'px';
      proxy.style.top = r.top + 'px';
      proxy.style.width = r.w + 'px';
      proxy.style.height = r.h + 'px';
      proxy.style.borderRadius = radius + 'px';
    };

    const renderAt = t => {
      if (state.variant === 'A') {
        if (t < p.move) {
          setRect(lerpRect(start, center, easeInOut(t / p.move)), 8);
        } else if (t < p.move + p.hold) {
          setRect(center, 8);
        } else {
          const k = clamp01((t - p.move - p.hold) / p.grow);
          const e = easeOut(k);
          setRect(lerpRect(center, end, e), 8 + 4 * e);
        }
        return;
      }
      const k = clamp01(t / p.grow);
      const e = easeOut(k);
      setRect(lerpRect(start, end, e), 8 + 4 * e);
    };

    const cleanup = () => {
      proxy.remove();
      scroller.style.opacity = '1';
      if (card.isConnected) {
        card.style.opacity = '';
        card.style.pointerEvents = '';
      }
      active = null;
    };

    return { card, scroller, proxy, p, crossStart, renderAt, cleanup };
  }

  function playTransition(tool) {
    state.lastTool = tool;
    if (state.reduced) { navigate(tool); return; }
    if (active) return;
    const o = beginOverlay(tool);
    if (!o) { navigate(tool); return; }

    let stopped = false;
    active = { abort: () => { stopped = true; o.cleanup(); } };

    const t0 = performance.now();

    function tick(now) {
      if (stopped) return;
      const t = now - t0;

      if (state.freeze) {
        const cap = Math.min(o.p.total * state.freezePos / 100, o.crossStart);
        if (t >= cap) { o.renderAt(cap); return; }
        o.renderAt(t);
        requestAnimationFrame(tick);
        return;
      }

      if (t < o.crossStart) {
        o.renderAt(t);
        requestAnimationFrame(tick);
        return;
      }

      o.renderAt(o.crossStart);
      swapPage(tool);
      o.scroller.style.opacity = '0';

      const f0 = performance.now();
      function fade(now2) {
        if (stopped) return;
        const f = clamp01((now2 - f0) / o.p.fade);
        o.proxy.style.opacity = String(1 - f);
        o.scroller.style.opacity = String(f);
        if (f < 1) { requestAnimationFrame(fade); return; }
        o.cleanup();
        focusPage();
      }
      requestAnimationFrame(fade);
    }

    requestAnimationFrame(tick);
  }

  function freezeStill(pct) {
    if (active) return;
    const tool = QS.get('auto') || state.lastTool || 'file-rename';
    const o = beginOverlay(tool);
    if (!o) return;
    o.renderAt(Math.min(o.p.total * pct / 100, o.crossStart));
    active = { abort: o.cleanup };
  }

  /* ================= 适配与面板 ================= */

  function fit() {
    const stage = document.getElementById('stage');
    if (isCapture) { stage.style.zoom = 1; return; }
    const wrap = document.querySelector('.stagewrap');
    const w = state.size, h = state.size === 900 ? 600 : 760;
    const k = Math.min(1, (wrap.clientWidth - 48) / w, (wrap.clientHeight - 76) / h);
    stage.style.zoom = k;
  }

  function syncPanel() {
    const p = phases();
    document.getElementById('durOut').textContent = state.duration + ' ms';
    let text;
    if (state.reduced) {
      text = '已开启减弱动态：点卡片为<b>瞬时切换</b>，不播动画。';
    } else if (state.variant === 'A') {
      text = '移动 <b>' + p.move + '</b> · 停顿 <b>' + p.hold + '</b> · 展开 <b>' + p.grow
        + '</b> · 淡入 <b>' + p.fade + '</b> ms<br>飞行内容只保留<b>徽标</b>，文字不参与动画';
    } else {
      text = '生长 <b>' + p.grow + '</b> · 淡入 <b>' + p.fade + '</b> ms<br>飞行内容只保留<b>徽标</b>，文字不参与动画';
    }
    if (state.freeze) text += '<br>已开启中间帧冻结：<b>' + state.freezePos + '%</b>（不换页）';
    text += '<br>导航切页：<b>200 ms</b> 顺序淡变 + 8px 上移';
    document.getElementById('phases').innerHTML = text;

    document.getElementById('dur').value = state.duration;
    document.getElementById('freezePos').disabled = !state.freeze;

    document.getElementById('caption').textContent = state.reduced
      ? '减弱动态已开启：卡片点击为瞬时切换（对照）。'
      : (state.variant === 'A'
        ? 'A｜两拍：原尺寸平移到内容区中心 → 停顿 → 向四周铺开；飞行中只保留徽标。'
        : 'B｜连续生长：平移与放大同时发生，路径经过中心；飞行中只保留徽标。');
  }

  /* ================= 事件 ================= */

  document.getElementById('win').addEventListener('click', e => {
    const toggle = e.target.closest('[data-action="toggle-nav"]');
    if (toggle) {
      state.navCollapsed = !state.navCollapsed;
      renderShell();
      return;
    }
    const nav = e.target.closest('[data-nav]');
    if (nav) {
      const key = nav.dataset.nav;
      if (key === state.page) return;
      if (active) { abortAnimation(); navigate(key); return; }
      navigate(key, { animateNav: true });
      return;
    }
    const card = e.target.closest('[data-tool]');
    if (card && !card.classList.contains('disabled')) {
      abortNavTransition();
      playTransition(card.dataset.tool);
    }
  });

  document.getElementById('variants').addEventListener('change', e => {
    state.variant = e.target.value;
    state.duration = DEFAULTS[state.variant];
    state.page = 'home';
    renderShell();
    syncPanel();
  });

  document.getElementById('themes').addEventListener('change', e => {
    state.theme = e.target.value;
    renderShell();
    syncPanel();
  });

  document.getElementById('sizes').addEventListener('change', e => {
    state.size = Number(e.target.value);
    renderShell();
    syncPanel();
  });

  document.getElementById('dur').addEventListener('input', e => {
    state.duration = Number(e.target.value);
    syncPanel();
  });

  document.getElementById('reduced').addEventListener('change', e => {
    state.reduced = e.target.checked;
    if (state.reduced) {
      abortAnimation();
      abortNavTransition();
    }
    syncPanel();
  });

  document.getElementById('freeze').addEventListener('change', e => {
    state.freeze = e.target.checked;
    if (!state.freeze) {
      abortAnimation();
      abortNavTransition();
    }
    syncPanel();
  });

  document.getElementById('freezePos').addEventListener('input', e => {
    state.freezePos = Number(e.target.value);
    if (active && state.lastTool) {
      abortAnimation();
      playTransition(state.lastTool);
    }
    if (navActive) abortNavTransition();
    syncPanel();
  });

  document.getElementById('replay').addEventListener('click', () => {
    abortAnimation();
    if (state.page !== 'home') navigate('home');
    const tool = state.lastTool || 'file-rename';
    requestAnimationFrame(() => playTransition(tool));
  });

  document.getElementById('home').addEventListener('click', () => {
    abortAnimation();
    navigate('home');
  });

  window.addEventListener('resize', fit);

  window.__card2page = { state, playTransition, navigate, renderShell, phases, abortAnimation };

  function applyQuery() {
    const variant = QS.get('variant');
    if (variant && DEFAULTS[variant.toUpperCase()]) {
      state.variant = variant.toUpperCase();
      state.duration = DEFAULTS[state.variant];
    }
    if (QS.get('theme')) state.theme = QS.get('theme');
    if (QS.get('size')) state.size = Number(QS.get('size'));
    if (QS.get('dur')) state.duration = Number(QS.get('dur'));
    if (QS.get('freeze') === '1') state.freeze = true;
    if (QS.get('pos')) state.freezePos = Number(QS.get('pos'));
    if (QS.get('page')) state.page = QS.get('page');

    const setRadio = (name, value) => {
      const el = document.querySelector('input[name="' + name + '"][value="' + value + '"]');
      if (el) el.checked = true;
    };
    setRadio('variant', state.variant);
    setRadio('theme', state.theme);
    setRadio('size', String(state.size));
    document.getElementById('dur').value = state.duration;
    document.getElementById('freeze').checked = state.freeze;
    document.getElementById('freezePos').value = state.freezePos;
    document.getElementById('freezePos').disabled = !state.freeze;
  }

  applyQuery();
  renderShell();
  syncPanel();

  if (QS.get('scroll')) {
    document.getElementById('scroller').scrollTop = Number(QS.get('scroll'));
  }

  const still = QS.get('still');
  const navDemo = QS.get('nav');
  if (still) {
    setTimeout(() => freezeStill(Number(still)), 120);
  } else if (navDemo) {
    setTimeout(() => navigate(navDemo, { animateNav: true }), 120);
  } else {
    const auto = QS.get('auto');
    if (auto) {
      requestAnimationFrame(() => requestAnimationFrame(() => playTransition(auto)));
    }
  }
</script>
</body>
</html>

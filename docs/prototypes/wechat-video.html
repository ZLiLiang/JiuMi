<!DOCTYPE html>
<!--
  微信视频下载 · UI 提案原型（设计参考，不参与构建）

  参数：
    ?theme=light|dark        主题（默认 light）
    ?window=wide|narrow      窗口宽度：wide 1200、narrow 900（默认 wide）
    ?header=inline|stacked|card
                             页头方案：单行 / 双层 / 目录进卡片（默认 inline）
    ?size=actual|reported|unknown
                             列表「大小」：只显示真实值 / 微信上报值 / 未知时写「大小未知」
    ?emptycta=1              停止态空态里放「开启监听」按钮
    ?cert=window|dialog|none 证书确认：独立确认窗 / FAContentDialog / 不做应用内确认
    ?state=list|empty|running-empty|dir-missing|residual|cert
                             页面状态（默认 list）
    ?capture=1               出图模式：隐藏评审栏与滚动条，只留 1200×760 的窗口本身

  本原型只演示布局与状态流转，不连微信、代理与文件系统：
  监听开关、证书确认框、目录选择、行内下载/取消/移除都可点，用来复核交互。

  定稿依据见 issue #97「微信视频下载：工具页与设置接入」。
-->
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<title>微信视频下载 · UI 提案</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  :root {
    --bg: #eef0f4;
    --mica-a: #e9eef7;
    --mica-b: #f6eef4;
    --island: rgba(255, 255, 255, 0.68);
    --island-border: rgba(0, 0, 0, 0.07);
    --island-shadow: 0 2px 8px rgba(0, 0, 0, 0.09);
    --card: rgba(255, 255, 255, 0.72);
    --card-border: rgba(0, 0, 0, 0.06);
    --solid: #f9f9f9;
    --text: #1b1b1b;
    --text-2: rgba(0, 0, 0, 0.55);
    --text-3: rgba(0, 0, 0, 0.38);
    --accent: #0f6cbd;
    --accent-soft: rgba(15, 108, 189, 0.16);
    --chip: rgba(0, 0, 0, 0.045);
    --sel: rgba(0, 0, 0, 0.05);
    --divider: rgba(0, 0, 0, 0.08);
    --crit: #c42b1c;
    --crit-bg: rgba(196, 43, 28, 0.07);
    --warn: #9a6700;
    --warn-bg: rgba(154, 103, 0, 0.08);
    --scrim: rgba(12, 18, 28, 0.38);
  }
  [data-theme="dark"] {
    --bg: #16171b;
    --mica-a: #1e2027;
    --mica-b: #221f28;
    --island: rgba(58, 60, 70, 0.66);
    --island-border: rgba(255, 255, 255, 0.09);
    --island-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    --card: rgba(72, 74, 84, 0.5);
    --card-border: rgba(255, 255, 255, 0.07);
    --solid: #202020;
    --text: #f2f2f2;
    --text-2: rgba(255, 255, 255, 0.62);
    --text-3: rgba(255, 255, 255, 0.4);
    --accent: #60cdff;
    --accent-soft: rgba(96, 205, 255, 0.22);
    --chip: rgba(255, 255, 255, 0.08);
    --sel: rgba(255, 255, 255, 0.08);
    --divider: rgba(255, 255, 255, 0.09);
    --crit: #ff99a4;
    --crit-bg: rgba(255, 153, 164, 0.12);
    --warn: #e8c76a;
    --warn-bg: rgba(232, 199, 106, 0.12);
    --scrim: rgba(0, 0, 0, 0.6);
  }
  html, body { min-height: 100%; }
  html.capture body { display: flex; overflow: hidden; background: transparent; padding: 0; gap: 0; }
  html.capture .scroll, html.capture .rows { scrollbar-width: none; }
  html.capture .scroll::-webkit-scrollbar, html.capture .rows::-webkit-scrollbar { display: none; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    background: var(--bg);
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    color: var(--text);
  }
  .app {
    position: relative;
    width: 1200px;
    height: 760px;
    flex: none;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(900px 520px at 8% 0%, var(--mica-a), transparent 70%),
      radial-gradient(760px 480px at 96% 100%, var(--mica-b), transparent 72%),
      var(--bg);
    overflow: hidden;
  }
  .app.narrow { width: 900px; }
  .titlebar {
    height: 40px;
    flex: 0 0 40px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
  }
  .logo {
    width: 18px; height: 18px; border-radius: 4px;
    background: linear-gradient(135deg, #6ea8fe, #0f6cbd);
  }
  .appname { font-size: 12px; color: var(--text-2); }

  .shell { flex: 1; min-height: 0; display: flex; gap: 14px; padding: 0 14px 14px; }
  .island {
    background: var(--island);
    border: 1px solid var(--island-border);
    border-radius: 12px;
    box-shadow: var(--island-shadow);
    backdrop-filter: blur(30px);
  }

  .nav { flex: 0 0 280px; padding: 8px 8px 8px 12px; display: flex; flex-direction: column; gap: 2px; }
  .nav-toggle {
    width: 36px; height: 32px;
    display: grid; place-items: center;
    border: 0; border-radius: 4px;
    background: transparent; color: var(--text-2);
    margin-bottom: 6px;
  }
  .nav-items { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    position: relative;
    height: 36px;
    display: flex; align-items: center; gap: 14px;
    padding: 0 12px;
    border-radius: 4px;
    font-size: 14px;
    color: var(--text);
    white-space: nowrap; overflow: hidden;
  }
  .nav-item svg { flex: 0 0 16px; }
  .nav-item.disabled { color: var(--text-3); }
  .nav-item.disabled .badge { margin-left: auto; }
  .badge {
    font-size: 10px; line-height: 16px; padding: 0 6px;
    border-radius: 4px; background: var(--chip); color: var(--text-3);
  }
  .nav-item.selected { background: var(--sel); }
  .nav-item.selected svg { color: var(--accent); }
  .nav-item.selected::before {
    content: "";
    position: absolute; left: 0; top: 10px;
    width: 3px; height: 16px; border-radius: 2px;
    background: var(--accent);
  }
  .nav-spacer { flex: 1; }
  .divider { height: 1px; background: var(--divider); margin: 6px 12px; }

  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .scroll { flex: 1; min-height: 0; overflow: auto; padding: 32px 44px 36px; display: flex; flex-direction: column; }

  .page-head { display: flex; align-items: flex-start; gap: 16px; }
  .app.narrow .page-head.inline { flex-direction: column; align-items: stretch; }
  .app.narrow .page-head.inline .page-actions { margin-left: 0; margin-top: 12px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; line-height: 1.25; }
  .subtitle { margin: 6px 0 0; font-size: 13px; color: var(--text-2); }
  .page-actions { margin-left: auto; display: flex; align-items: flex-start; gap: 8px; }
  .dir-extra { margin-top: 12px; display: flex; align-items: flex-start; }
  .dir-extra .dir-button { max-width: 320px; }
  .dir-extra .dir-button .name { max-width: 270px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 32px; padding: 0 12px;
    border: 1px solid var(--island-border);
    border-radius: 4px;
    background: var(--card);
    color: var(--text);
    font: inherit; font-size: 13px;
    white-space: nowrap;
  }
  .btn svg { color: var(--text-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  [data-theme="dark"] .btn.primary { color: #0b0b0b; }
  .btn.ghost { background: transparent; }
  .btn.small { height: 32px; padding: 0 12px; font-size: 12.5px; }
  .btn[disabled] { opacity: 0.45; }
  .btn:focus-visible, .segment:focus-visible, .dir-pop button:focus-visible, .help:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .help {
    width: 20px; height: 20px; padding: 0;
    display: grid; place-items: center;
    border: 1px solid var(--island-border); border-radius: 10px;
    background: var(--chip); color: var(--text-3);
    font: inherit; font-size: 11px;
  }

  .dir-wrap { position: relative; display: flex; flex-direction: column; align-items: flex-start; }
  .dir-button { max-width: 200px; }
  .dir-button .name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dir-button.bad { border-color: var(--warn); color: var(--warn); }
  .dir-button.bad svg { color: var(--warn); }
  .page-warn {
    margin-top: 12px;
    padding: 10px 12px;
    border: 1px solid var(--warn);
    border-radius: 4px;
    background: var(--warn-bg);
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--text);
  }
  .page-warn:not([hidden]) + .card { margin-top: 12px; }
  .dir-pop {
    position: absolute; z-index: 30; top: calc(100% + 6px); left: 0;
    width: 286px; padding: 6px;
    border: 1px solid var(--island-border); border-radius: 8px;
    background: var(--solid);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
  }
  .dir-pop button {
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border: 0; border-radius: 4px;
    background: transparent; color: var(--text);
    font: inherit; font-size: 12.5px; text-align: left;
  }
  .dir-pop button:hover { background: var(--sel); }
  .dir-pop .tag { margin-left: auto; font-size: 10.5px; color: var(--warn); white-space: nowrap; }

  .listen { display: inline-flex; align-items: center; gap: 8px; height: 32px; font-size: 11.5px; color: var(--text-2); }
  .listen .state.on { color: var(--accent); }
  .switch { display: inline-flex; align-items: center; }
  .switch input {
    appearance: none; margin: 0; width: 40px; height: 20px;
    border-radius: 10px; background: var(--text-3);
    position: relative; outline: 0;
  }
  .switch input::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 14px; height: 14px; border-radius: 50%; background: #fff;
    transition: left 120ms ease;
  }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { left: 23px; }
  .switch input[disabled] { opacity: 0.5; }

  .card {
    margin-top: 22px;
    padding: 20px;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    background: var(--card);
    display: flex; flex-direction: column;
    flex: 1 1 auto; min-height: 0;
  }
  .dir-strip {
    flex: none;
    flex-direction: row; align-items: center; gap: 12px;
    padding: 12px 20px;
  }
  .dir-strip + .card { margin-top: 12px; }
  .dir-strip .strip-label { font-size: 12px; color: var(--text-2); }
  .dir-strip .dir-pop { top: calc(100% + 6px); }

  .list-summary {
    flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding-bottom: 10px;
    font-size: 12px; color: var(--text-2);
  }
  .list-summary .order { font-size: 11px; color: var(--text-3); }
  .rows { flex: 1 1 auto; min-height: 0; overflow: auto; display: flex; flex-direction: column; }

  .list-row {
    display: grid; grid-template-columns: 56px minmax(0, 1fr) auto;
    align-items: center; gap: 14px;
    min-height: 76px; padding: 8px 0;
    border-bottom: 1px solid var(--divider);
  }
  .list-row:last-child { border-bottom: 0; }
  .thumb {
    position: relative; width: 56px; height: 56px;
    border: 1px solid var(--card-border); border-radius: 4px;
    overflow: hidden;
  }
  .thumb::after {
    content: ""; position: absolute; left: 22px; top: 20px;
    width: 0; height: 0;
    border-left: 10px solid rgba(255, 255, 255, 0.86);
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4));
  }
  .thumb.a { background: linear-gradient(140deg, #33546b, #86b7c9); }
  .thumb.b { background: linear-gradient(140deg, #4b3b2f, #c9a37a); }
  .thumb.c { background: linear-gradient(140deg, #2c3b46, #6f9b8e); }
  .thumb.d { background: linear-gradient(140deg, #3f3550, #a58bc4); }
  .thumb.e { background: linear-gradient(140deg, #4a3d2a, #c7b17a); }
  .thumb.f { background: linear-gradient(140deg, #26323d, #7f9db5); }
  .row-main { min-width: 0; }
  .row-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-meta { margin-top: 3px; font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-note { margin-top: 3px; font-size: 11px; line-height: 1.4; color: var(--text-3); }
  .row-note.bad { color: var(--crit); }
  .progress { margin-top: 6px; width: 160px; height: 4px; border-radius: 2px; background: var(--chip); overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--accent); }
  .app.narrow .progress { width: 120px; }
  .row-side { display: flex; align-items: center; gap: 12px; }
  .chip {
    display: inline-flex; align-items: center;
    font-size: 11px; line-height: 18px;
    padding: 0 7px; border-radius: 4px;
    background: var(--chip); color: var(--text-2);
    white-space: nowrap;
  }
  .chip.done { background: var(--accent-soft); color: var(--accent); }
  .chip.failed { background: transparent; box-shadow: inset 0 0 0 1px var(--crit); color: var(--crit); }
  .chip.expired { background: transparent; box-shadow: inset 0 0 0 1px var(--warn); color: var(--warn); }
  .list-row.expired .thumb { filter: grayscale(0.85) brightness(0.92); }
  .list-row.expired .row-title { color: var(--text-2); }
  .list-row.expired .row-meta { color: var(--text-3); }

  .empty-card { align-items: center; justify-content: center; gap: 0; text-align: center; }
  .empty-card .slot {
    width: 56px; height: 56px; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--chip); color: var(--text-3);
    margin-bottom: 14px;
  }
  .empty-card .title { font-size: 14px; font-weight: 600; }
  .empty-card .hint { margin-top: 6px; max-width: 380px; font-size: 12px; line-height: 1.6; color: var(--text-2); white-space: normal; }
  .empty-card .btn { margin-top: 16px; }

  .infobar {
    flex: none;
    margin: 12px 12px 0;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--island-border);
    border-radius: 4px;
    background: var(--card);
    font-size: 12.5px;
  }
  .infobar .mark {
    width: 16px; height: 16px; border-radius: 50%;
    display: grid; place-items: center; flex: none;
    font-size: 10px; color: #fff; background: var(--accent);
  }
  .infobar.warn .mark { background: var(--warn); }
  .infobar .msg { flex: 1; min-width: 0; }
  .infobar .close {
    flex: none; width: 28px; height: 28px; padding: 0;
    display: grid; place-items: center;
    border: 0; border-radius: 4px;
    background: transparent; color: var(--text-2);
    font: inherit; font-size: 15px;
  }
  .infobar .close:hover { background: var(--sel); color: var(--text); }

  .overlay {
    position: absolute; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    background: var(--scrim);
  }
  .dialog.window {
    width: 420px;
    padding: 32px 36px;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    background: var(--solid);
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
  }
  .dialog.window h2 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.4; }
  .dialog.window .body { margin: 10px 0 0; font-size: 14px; line-height: 20px; color: var(--text-2); }
  .dialog.window .note { margin: 8px 0 0; font-size: 12px; line-height: 18px; color: var(--text-3); }
  .dialog.window .actions { margin-top: 18px; display: flex; justify-content: flex-end; gap: 8px; }
  .dialog.facontent {
    width: 400px;
    padding: 22px 24px 20px;
    border: 1px solid var(--island-border);
    border-radius: 8px;
    background: var(--bg);
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
  }
  [data-theme="dark"] .dialog.facontent { background: #2b2b2b; }
  .dialog.facontent h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .dialog.facontent .body { margin: 10px 0 0; font-size: 13px; line-height: 1.6; color: var(--text); }
  .dialog.facontent .note { margin: 8px 0 0; font-size: 11px; line-height: 1.6; color: var(--text-3); }
  .dialog.facontent .actions { margin-top: 20px; display: flex; justify-content: flex-end; gap: 8px; }

  .review-bar {
    width: 1200px; max-width: calc(100vw - 32px);
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 10px 14px;
    padding: 10px 14px;
    border: 1px solid var(--card-border); border-radius: 8px;
    background: var(--card);
    font-size: 12px;
  }
  html.capture .review-bar { display: none; }
  .rb-title { font-weight: 600; font-size: 13px; margin-right: 4px; }
  .rb-item { display: flex; align-items: center; gap: 6px; }
  .rb-item > span { color: var(--text-2); white-space: nowrap; }
  .rb-check { display: flex; align-items: center; gap: 6px; color: var(--text-2); }
  .rb-check input { width: 14px; height: 14px; margin: 0; accent-color: var(--accent); }
  .rb-hint { flex-basis: 100%; font-size: 11px; color: var(--text-3); }
  .review-bar .segment { height: 24px; padding: 0 9px; font-size: 11.5px; }
  .segments { display: flex; gap: 2px; padding: 2px; border-radius: 4px; background: var(--chip); }
  .segment {
    height: 28px; padding: 0 12px;
    border: 0; border-radius: 3px;
    background: transparent; color: var(--text-2);
    font: inherit; font-size: 13px; white-space: nowrap;
  }
  .segment.active { background: var(--card); color: var(--text); }
</style>
</head>
<body>
<div class="review-bar" id="review-bar">
  <span class="rb-title">微信视频下载 · 布局评审</span>

  <div class="rb-item">
    <span>主题</span>
    <div class="segments" data-group="theme">
      <button class="segment" data-value="light">浅色</button>
      <button class="segment" data-value="dark">深色</button>
    </div>
  </div>

  <div class="rb-item">
    <span>页头</span>
    <div class="segments" data-group="header">
      <button class="segment" data-value="inline">单行</button>
      <button class="segment" data-value="stacked">双层</button>
      <button class="segment" data-value="card">目录进卡片</button>
    </div>
  </div>

  <div class="rb-item">
    <span>宽度</span>
    <div class="segments" data-group="width">
      <button class="segment" data-value="1200">1200</button>
      <button class="segment" data-value="900">900</button>
    </div>
  </div>

  <div class="rb-item">
    <span>大小</span>
    <div class="segments" data-group="size">
      <button class="segment" data-value="actual">真实值</button>
      <button class="segment" data-value="reported">上报值</button>
      <button class="segment" data-value="unknown">未知写「未知」</button>
    </div>
  </div>

  <label class="rb-check"><input type="checkbox" id="rb-emptycta" /> 空态放「开启监听」</label>

  <div class="rb-item">
    <span>证书框</span>
    <div class="segments" data-group="cert">
      <button class="segment" data-value="window">自定义窗</button>
      <button class="segment" data-value="dialog">FAContentDialog</button>
      <button class="segment" data-value="none">不做</button>
    </div>
  </div>

  <div class="rb-item">
    <span>状态</span>
    <div class="segments" data-group="state">
      <button class="segment" data-value="list">列表</button>
      <button class="segment" data-value="empty">空态</button>
      <button class="segment" data-value="running-empty">监听中空</button>
      <button class="segment" data-value="dir-missing">目录缺失</button>
      <button class="segment" data-value="residual">残留提示</button>
    </div>
  </div>

  <button class="btn small" id="rb-open-cert">打开证书框</button>
  <span class="rb-hint">点监听开关看首次证书确认；点目录按钮选路径（含不存在目录）；行内按钮演示下载 / 取消 / 移除。URL 参数同样生效，`?capture=1` 出图。</span>
</div>

<div class="app" id="app">
  <header class="titlebar">
    <div class="logo"></div>
    <span class="appname">JiuMi</span>
  </header>

  <div class="shell">
    <nav class="island nav">
      <button class="nav-toggle" aria-label="收起导航">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
          <rect x="2" y="3" width="12" height="10" rx="2" /><path d="M6.5 3v10" />
        </svg>
      </button>
      <div class="nav-items">
        <a class="nav-item">

    <button data-dir="">不选择</button>

<script>
const params = new URLSearchParams(location.search);
const MISSING_DIR = 'C:\\Users\\LiLiang\\Videos';

const initialItems = () => ([
  { id: 1, title: '城市夜骑第一视角｜江边晚风', author: '骑行日记', seconds: 222, actual: 12.4, reported: 60.4, state: 'downloading', progress: 27 },
  { id: 2, title: '周末去山里露营，搭帐篷的全过程', author: '山野慢生活', seconds: 495, actual: null, reported: 68.7, state: 'idle' },
  { id: 3, title: '猫咪第一次见到雪', author: '毛球日常', seconds: 48, actual: 6.8, reported: 26.6, state: 'completed' },
  { id: 4, title: '手冲咖啡入门：水温与研磨', author: '咖啡小站', seconds: 312, actual: 18.2, reported: 41.2, state: 'failed', failure: '网络连接中断，已重试 2 次' },
  { id: 5, title: '老城区的清晨', author: '街拍笔记', seconds: 140, actual: 9.1, reported: 23.5, state: 'expired' },
  { id: 6, title: '凌晨四点的便利店', author: '夜行记录', seconds: 246, actual: null, reported: 19.8, state: 'queued' },
]);

const model = {
  theme: params.get('theme') === 'dark' ? 'dark' : 'light',
  width: params.get('window') === 'narrow' ? 900 : 1200,
  header: ['inline', 'stacked', 'card'].includes(params.get('header')) ? params.get('header') : 'inline',
  size: ['actual', 'reported', 'unknown'].includes(params.get('size')) ? params.get('size') : 'actual',
  cert: ['window', 'dialog', 'none'].includes(params.get('cert')) ? params.get('cert') : 'window',
  emptyCta: params.get('emptycta') === '1',
  state: ['list', 'empty', 'running-empty', 'dir-missing', 'residual', 'cert'].includes(params.get('state')) ? params.get('state') : 'list',
  running: true,
  busy: null,
  trusted: true,
  dir: params.get('dir') || 'D:\\Videos\\微信视频',
  items: initialItems(),
  modalOpen: false,
  infoOpen: false,
  dirPopOpen: false,
};

const timers = new Map();

const escapeHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function formatDuration(seconds) {
  const m = Math.floor(seconds / 60);
  const s = String(seconds % 60).padStart(2, '0');
  return m + ':' + s;
}

function isDirMissing() { return model.dir === MISSING_DIR; }
function canDownload() { return !!model.dir && !isDirMissing(); }

function sizeText(item) {
  if (model.size === 'reported') return '约 ' + item.reported.toFixed(1) + ' MB';
  if (model.size === 'unknown') return item.actual ? item.actual.toFixed(1) + ' MB' : '大小未知';
  return item.actual ? item.actual.toFixed(1) + ' MB' : '';
}

function applyState(state) {
  clearTimers();
  model.state = state;
  model.items = initialItems();
  model.running = true;
  model.busy = null;
  model.trusted = true;
  model.dir = 'D:\\Videos\\微信视频';
  model.modalOpen = false;
  model.infoOpen = false;
  model.dirPopOpen = false;
  if (state === 'empty') {
    model.items = [];
    model.running = false;
    model.trusted = false;
  } else if (state === 'running-empty') {
    model.items = [];
  } else if (state === 'dir-missing') {
    model.dir = MISSING_DIR;
  } else if (state === 'residual') {
    model.infoOpen = true;
  } else if (state === 'cert') {
    model.items = [];
    model.running = false;
    model.trusted = false;
    model.modalOpen = true;
  }
}

function clearTimers() {
  timers.forEach((timer) => clearInterval(timer));
  timers.clear();
}

function clearTimer(id) {
  const timer = timers.get(id);
  if (timer) clearInterval(timer);
  timers.delete(id);
}

function statusText(item) {
  const map = {
    idle: '待下载',
    queued: '排队中',
    downloading: '下载中 ' + item.progress + '%',
    completed: '已下载',
    failed: '失败',
    expired: '已过期',
    canceled: '已取消',
  };
  return map[item.state] || '待下载';
}

function chipClass(item) {
  if (item.state === 'completed') return 'done';
  if (item.state === 'failed') return 'failed';
  if (item.state === 'expired') return 'expired';
  return '';
}

function actionFor(item) {
  if (item.state === 'queued' || item.state === 'downloading') return { act: 'cancel', label: '取消' };
  if (item.state === 'completed' || item.state === 'expired') return { act: 'remove', label: '移除' };
  if (item.state === 'failed') return { act: 'download', label: '重试' };
  return { act: 'download', label: '下载' };
}

function rowHtml(item) {
  const meta = [];
  if (item.author) meta.push(escapeHtml(item.author));
  meta.push(formatDuration(item.seconds));
  const size = sizeText(item);
  if (size) meta.push(escapeHtml(size));

  let note = '';
  if (item.state === 'failed') note = '<div class="row-note bad">' + escapeHtml(item.failure || '下载失败，可重试') + '</div>';
  if (item.state === 'expired') note = '<div class="row-note">链接已过期，请在微信中重新打开该视频</div>';
  if (item.state === 'canceled') note = '<div class="row-note">已取消，可重新下载</div>';

  const progress = item.state === 'downloading'
    ? '<div class="progress"><i style="width:' + item.progress + '%"></i></div>'
    : '';

  const action = actionFor(item);
  const disabled = action.act === 'download' && !canDownload();
  const title = disabled ? ' title="先选择下载目录"' : '';

  return '' +
    '<div class="list-row ' + (item.state === 'expired' ? 'expired' : '') + '">' +
      '<div class="thumb ' + 'abcdef'[item.id % 6] + '"></div>' +
      '<div class="row-main">' +
        '<div class="row-title">' + escapeHtml(item.title) + '</div>' +
        '<div class="row-meta">' + meta.join(' · ') + '</div>' +
        note + progress +
      '</div>' +
      '<div class="row-side">' +
        '<span class="chip ' + chipClass(item) + '">' + statusText(item) + '</span>' +
        '<button class="btn small" data-row="' + item.id + '" data-act="' + action.act + '"' + (disabled ? ' disabled' : '') + title + '>' + action.label + '</button>' +
      '</div>' +
    '</div>';
}

function renderRows() {
  const rows = document.getElementById('rows');
  rows.innerHTML = model.items.map(rowHtml).join('');
}

function renderDir() {
  const control = document.getElementById('dir-control');
  control.hidden = false;
  const host = model.header === 'card'
    ? document.getElementById('dir-strip-control')
    : model.header === 'stacked'
      ? document.getElementById('dir-extra')
      : document.getElementById('dir-header');
  host.appendChild(control);
  document.getElementById('dir-strip').hidden = model.header !== 'card';
  document.getElementById('dir-extra').hidden = model.header !== 'stacked';

  const name = document.getElementById('dir-name');
  name.textContent = model.dir || '选择下载目录';
  const button = document.getElementById('dir-button');
  button.title = model.dir || '选择下载目录';
  button.classList.toggle('bad', isDirMissing());
  document.getElementById('dir-pop').hidden = !model.dirPopOpen;
}

function renderListen() {
  const input = document.getElementById('listen');
  input.checked = model.running;
  input.disabled = !!model.busy || model.modalOpen;
  const text = document.getElementById('listen-state');
  if (model.busy === 'starting') {
    text.textContent = '正在启动…';
    text.className = 'state';
  } else if (model.busy === 'stopping') {
    text.textContent = '正在停止…';
    text.className = 'state';
  } else if (model.running) {
    text.textContent = '监听中';
    text.className = 'state on';
  } else {
    text.textContent = '未监听';
    text.className = 'state';
  }
}

function renderEmpty() {
  const empty = model.items.length === 0;
  document.getElementById('empty').hidden = !empty;
  document.getElementById('list-card').hidden = empty;
  const pageWarn = document.getElementById('page-warn');
  if (!empty) {
    document.getElementById('list-count').textContent = model.items.length + ' 个视频 · 仅本次会话，关闭应用后清空';
    pageWarn.hidden = canDownload();
    if (!canDownload()) {
      pageWarn.textContent = model.dir
        ? '下载目录不存在，下载已暂停。请重新选择目录，或恢复该文件夹。'
        : '尚未选择下载目录，下载已暂停。';
    }
    return;
  }
  pageWarn.hidden = true;
  document.getElementById('empty-title').textContent = model.running ? '正在监听' : '还没有捕获到视频';
  const showCta = model.emptyCta && !model.running;
  document.getElementById('empty-hint').textContent = model.running
    ? '在微信里打开视频号视频，捕获后会自动出现在这里。'
    : showCta
      ? '点下面的「开启监听」开始，然后在微信视频号中打开视频。'
      : '用右上角的「监听」开关开始监听，然后在微信视频号中打开视频。';
  document.getElementById('empty-start').hidden = !showCta;
}

function certHtml() {
  const title = '安装 JiuMi 证书';
  const body = '监听需要在本机代理微信视频号页面，以取得当前视频的下载地址。首次开启会安装一张仅当前用户信任的根证书（CN=JiuMi，有效期 5 年）。';
  const note = '可在「设置 → 数据与联网」中卸载。确认后 Windows 会弹出证书信任提示。';
  if (model.cert === 'dialog') {
    return '<div class="dialog facontent">' +
      '<h2>' + title + '</h2>' +
      '<p class="body">' + body + '</p>' +
      '<p class="note">' + note + '</p>' +
      '<div class="actions">' +
        '<button class="btn small focus" id="cert-cancel">取消</button>' +
        '<button class="btn small primary" id="cert-ok">继续并开启</button>' +
      '</div>' +
    '</div>';
  }
  return '<div class="dialog window">' +
    '<h2>' + title + '</h2>' +
    '<p class="body">' + body + '</p>' +
    '<p class="note">' + note + '</p>' +
    '<div class="actions">' +
      '<button class="btn small focus" id="cert-cancel">取消</button>' +
      '<button class="btn small primary" id="cert-ok">继续并开启</button>' +
    '</div>' +
  '</div>';
}

function renderModal() {
  const overlay = document.getElementById('cert-overlay');
  overlay.hidden = !model.modalOpen;
  if (model.modalOpen) {
    document.getElementById('cert-dialog').outerHTML = certHtml();
    const dialog = document.querySelector('#cert-overlay > .dialog');
    dialog.id = 'cert-dialog';
    const cancel = document.getElementById('cert-cancel');
    if (cancel) cancel.focus();
  }
}

function renderReview() {
  document.querySelectorAll('.review-bar .segments').forEach((group) => {
    const key = group.dataset.group;
    group.querySelectorAll('.segment').forEach((button) => {
      let active = false;
      if (key === 'theme') active = button.dataset.value === model.theme;
      if (key === 'header') active = button.dataset.value === model.header;
      if (key === 'width') active = button.dataset.value === String(model.width);
      if (key === 'size') active = button.dataset.value === model.size;
      if (key === 'cert') active = button.dataset.value === model.cert;
      if (key === 'state') active = button.dataset.value === stateForModel();
      button.classList.toggle('active', active);
    });
  });
  document.getElementById('rb-emptycta').checked = model.emptyCta;
}

function stateForModel() {
  if (model.state === 'cert') return 'empty';
  return model.state;
}

function syncUrl() {
  if (params.get('capture') === '1') return;
  const next = new URLSearchParams();
  next.set('theme', model.theme);
  next.set('window', model.width === 900 ? 'narrow' : 'wide');
  next.set('header', model.header);
  next.set('size', model.size);
  next.set('cert', model.cert);
  if (model.emptyCta) next.set('emptycta', '1');
  next.set('state', stateForModel());
  history.replaceState(null, '', '?' + next.toString());
}

function render() {
  document.documentElement.dataset.theme = model.theme;
  document.getElementById('app').classList.toggle('narrow', model.width === 900);

  const head = document.getElementById('page-head');
  head.className = 'page-head ' + (model.header === 'stacked' ? 'stacked' : model.header === 'inline' ? 'inline' : 'card');

  document.getElementById('infobar').hidden = !model.infoOpen;

  renderDir();
  renderListen();
  renderEmpty();
  renderRows();
  renderModal();
  renderReview();
  syncUrl();
}

function startListening() {
  if (model.busy) return;
  model.busy = 'starting';
  render();
  setTimeout(() => {
    model.busy = null;
    model.running = true;
    model.trusted = true;
    render();
  }, 600);
}

function stopListening() {
  if (model.busy) return;
  model.busy = 'stopping';
  render();
  setTimeout(() => {
    model.busy = null;
    model.running = false;
    render();
  }, 420);
}

function requestListening() {
  if (!model.trusted && model.cert !== 'none') {
    model.modalOpen = true;
    render();
    return;
  }
  startListening();
}

function startDownload(id) {
  const item = model.items.find((entry) => entry.id === id);
  if (!item || !canDownload()) return;
  item.state = 'downloading';
  item.progress = Math.max(5, item.progress || 0);
  if (!item.actual) item.actual = Math.round(item.reported * 0.2 * 10) / 10;
  render();
  clearTimer(id);
  const timer = setInterval(() => {
    const current = model.items.find((entry) => entry.id === id);
    if (!current || current.state !== 'downloading') { clearTimer(id); return; }
    current.progress = Math.min(100, current.progress + 9);
    if (current.progress >= 100) {
      current.state = 'completed';
      clearTimer(id);
    }
    render();
  }, 220);
  timers.set(id, timer);
}

function cancelDownload(id) {
  clearTimer(id);
  const item = model.items.find((entry) => entry.id === id);
  if (!item) return;
  if (item.state === 'downloading') {
    item.state = 'canceled';
    item.progress = 0;
  } else if (item.state === 'queued') {
    item.state = 'canceled';
  }
  render();
}

function removeItem(id) {
  clearTimer(id);
  model.items = model.items.filter((entry) => entry.id !== id);
  render();
}

document.getElementById('listen').addEventListener('change', (event) => {
  if (event.target.checked) {
    event.target.checked = false;
    requestListening();
  } else {
    stopListening();
  }
});

document.getElementById('empty-start').addEventListener('click', requestListening);

document.getElementById('rb-open-cert').addEventListener('click', () => {
  model.modalOpen = true;
  render();
});

document.getElementById('info-close').addEventListener('click', () => {
  model.infoOpen = false;
  render();
});

document.querySelectorAll('.review-bar .segments').forEach((group) => {
  group.addEventListener('click', (event) => {
    const button = event.target.closest('.segment');
    if (!button) return;
    const key = group.dataset.group;
    const value = button.dataset.value;
    if (key === 'theme') model.theme = value;
    if (key === 'header') model.header = value;
    if (key === 'width') model.width = Number(value);
    if (key === 'size') model.size = value;
    if (key === 'cert') model.cert = value;
    if (key === 'state') applyState(value);
    render();
  });
});

document.getElementById('rb-emptycta').addEventListener('change', (event) => {
  model.emptyCta = event.target.checked;
  render();
});

document.getElementById('rows').addEventListener('click', (event) => {
  const button = event.target.closest('button[data-act]');
  if (!button) return;
  const id = Number(button.dataset.row);
  if (button.dataset.act === 'download') startDownload(id);
  if (button.dataset.act === 'cancel') cancelDownload(id);
  if (button.dataset.act === 'remove') removeItem(id);
});

document.getElementById('dir-button').addEventListener('click', (event) => {
  event.stopPropagation();
  model.dirPopOpen = !model.dirPopOpen;
  render();
});

document.getElementById('dir-pop').addEventListener('click', (event) => {
  const button = event.target.closest('button[data-dir]');
  if (!button) return;
  model.dir = button.dataset.dir || null;
  model.dirPopOpen = false;
  render();
});

document.addEventListener('click', (event) => {
  if (!model.dirPopOpen) return;
  if (!event.target.closest('#dir-control')) {
    model.dirPopOpen = false;
    render();
  }
});

document.getElementById('cert-overlay').addEventListener('click', (event) => {
  if (event.target.id === 'cert-overlay') return;
  if (event.target.id === 'cert-cancel') {
    model.modalOpen = false;
    render();
  }
  if (event.target.id === 'cert-ok') {
    model.modalOpen = false;
    if (!model.running) startListening();
    else render();
  }
});

document.addEventListener('keydown', (event) => {
  if (!model.modalOpen) return;
  if (event.key === 'Escape') {
    model.modalOpen = false;
    render();
  }
  if (event.key === 'Enter' && document.activeElement && document.activeElement.id === 'cert-ok') {
    model.modalOpen = false;
    if (!model.running) startListening();
    else render();
  }
});

if (params.get('capture') === '1') {
  document.documentElement.classList.add('capture');
}

if (params.get('state')) {
  applyState(params.get('state'));
}

render();
</script>
</body>
</html>
